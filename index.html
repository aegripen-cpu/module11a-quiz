</head><body><div class="box"><div class="spin"></div><p id="m">Loading Module 11A quiz…</p></div>

<script>
async function go(){
  const m=document.getElementById('m');
  try{
    const b64=(window.X0||'')+(window.X1||'')+(window.X2||'')+(window.X3||'')+(window.X4||'')+(window.X5||'')+(window.X6||'')+(window.X7||'')+(window.X8||'')+(window.X9||'')+(window.X10||'')+(window.X11||'')+(window.X12||'')+(window.X13||'')+(window.X14||'')+(window.X15||'')+(window.X16||'')+(window.X17||'')+(window.X18||'')+(window.X19||'')+(window.X20||'')+(window.X21||'')+(window.X22||'')+(window.X23||'')+(window.X24||'')+(window.X25||'')+(window.X26||'')+(window.X27||'')+(window.X28||'')+(window.X29||'');
    const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
    const stream=new Response(bin).body.pipeThrough(new DecompressionStream('gzip'));
    const html=await new Response(stream).text();
    document.open();document.write(html);document.close();
  }catch(e){m.textContent='Load failed: '+e.message;}
}
