<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0c0e10">
<title>Module 11A Quiz</title>
<style>
body{margin:0;background:#0c0e10;color:#e8eaed;font-family:system-ui;display:flex;align-items:center;justify-content:center;min-height:100vh}
.box{text-align:center;padding:2rem}
.spin{width:40px;height:40px;border:3px solid #2a3038;border-top-color:#e85d04;border-radius:50%;animation:s .8s linear infinite;margin:0 auto 1rem}
@keyframes s{to{transform:rotate(360deg)}}
p{color:#9aa0a6;font-size:.95rem}
</style>
</head>
<body>
<div class="box">
  <div class="spin"></div>
  <p id="m">Loading Module 11A quiz…</p>
</div>
<script src="H0.js"></script>
<script src="H1.js"></script>
<script src="H2.js"></script>
<script src="H3.js"></script>
<script src="H4.js"></script>
<script src="H5.js"></script>
<script src="H6.js"></script>
<script src="H7.js"></script>
<script src="H8.js"></script>
<script src="H9.js"></script>
<script src="H10.js"></script>
<script src="H11.js"></script>
<script src="H12.js"></script>
<script src="H13.js"></script>
<script src="H14.js"></script>
<script src="H15.js"></script>
<script>
async function go(){
  const m = document.getElementById('m');
  try {
    const b64 = (window.H0||'')+(window.H1||'')+(window.H2||'')+(window.H3||'')+(window.H4||'')+(window.H5||'')+(window.H6||'')+(window.H7||'')+(window.H8||'')+(window.H9||'')+(window.H10||'')+(window.H11||'')+(window.H12||'')+(window.H13||'')+(window.H14||'')+(window.H15||'');
    if (!b64 || b64.length < 1000) {
      m.textContent = 'Data missing – hard-refresh (pull to refresh) or try again in a moment.';
      return;
    }
    const bin = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
    const stream = new Response(bin).body.pipeThrough(new DecompressionStream('gzip'));
    const html = await new Response(stream).text();
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    m.textContent = 'Load failed: ' + e.message;
    console.error(e);
  }
}
go();
</script>
</body>
</html>
