<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0c0e10">
<title>Module 11A Quiz</title>
<style>
body{margin:0;background:#0c0e10;color:#e8eaed;font-family:system-ui;display:flex;align-items:center;justify-content:center;min-height:100vh}
.box{text-align:center;padding:2rem}
.spin{width:40px;height:40px;border:3px solid #2a3038;border-top-color:#e85d04;border-radius:50%;animation:s .8s linear infinite;margin:0 auto 1rem}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="box">
  <div class="spin"></div>
  <p id="m">Loading Module 11A quiz (622 questions)…</p>
</div>
<script src="X0.js"></script>
<script src="X1.js"></script>
<script src="X2.js"></script>
<script src="X3.js"></script>
<script src="X4.js"></script>
<script src="X5.js"></script>
<script src="X6.js"></script>
<script src="X7.js"></script>
<script src="X8.js"></script>
<script src="X9.js"></script>
<script src="X10.js"></script>
<script src="X11.js"></script>
<script src="X12.js"></script>
<script src="X13.js"></script>
<script>
async function go(){
  const m = document.getElementById('m');
  try {
    const b64 = (window.X0||'')+(window.X1||'')+(window.X2||'')+(window.X3||'')+(window.X4||'')+(window.X5||'')+(window.X6||'')+(window.X7||'')+(window.X8||'')+(window.X9||'')+(window.X10||'')+(window.X11||'')+(window.X12||'')+(window.X13||'');
    if (!b64 || b64.length < 1000) {
      m.textContent = 'Bank chunks missing. Hard-refresh or wait a moment.';
      return;
    }
    const bin = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
    const stream = new Response(bin).body.pipeThrough(new DecompressionStream('gzip'));
    const html = await new Response(stream).text();
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    m.textContent = 'Load failed: ' + e.message;
    console.error(e);
  }
}
go();
</script>
</body>
</html>
